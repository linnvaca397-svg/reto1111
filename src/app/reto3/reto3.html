
<h2>Registro de estudiantes</h2>

<form (ngSubmit)="registrar()">
  <p>
    <label for="nombre">Nombre:</label>
    <input id="nombre" name="nombre" [(ngModel)]="nombre">
  </p>

  <p>
    <label for="programa">Programa:</label>
    <input id="programa" name="programa" [(ngModel)]="programa">
  </p>

  <p>
    <label for="edad">Edad:</label>
    <input id="edad" name="edad" type="number" min="1" step="1" [(ngModel)]="edad">
  </p>

  <button type="submit">Registrar</button>
</form>

@if (mensaje) {
  <p>{{ mensaje }}</p>
}

<h3>Estudiantes registrados</h3>
<ul>
  @for (estudiante of estudiantes; track $index) {
    <li>{{ estudiante.nombre }} - {{ estudiante.programa }} - {{ estudiante.edad }} años</li>
  } @empty {
    <li>No hay estudiantes registrados.</li>
  }
</ul>
